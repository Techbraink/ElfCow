name: Build PDF Translator for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------------------------------------------
      # 3. Display environment
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          set -euxo pipefail

          echo "Python:"
          python3 --version

          echo "Architecture:"
          uname -m

          echo "macOS:"
          sw_vers

          echo "Homebrew:"
          brew --version

      # ------------------------------------------------------------
      # 4. Cache M2M100 model
      # ------------------------------------------------------------
      - name: Cache M2M100 model
        uses: actions/cache@v4
        with:
          path: resources/models/m2m100_418M
          key: m2m100-418M-macos-${{ runner.arch }}-v1

      # ------------------------------------------------------------
      # 5. Create isolated venv
      # ------------------------------------------------------------
      - name: Create isolated virtual environment
        run: |
          set -euxo pipefail

          python3 -m venv .venv

          .venv/bin/python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

      # ------------------------------------------------------------
      # 6. Install Python packages
      # ------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          set -euxo pipefail

          .venv/bin/python -m pip install \
            -r requirements.txt

      # ------------------------------------------------------------
      # 7. Install Tesseract on GitHub's Mac runner
      # ------------------------------------------------------------
      - name: Install Tesseract
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euxo pipefail

          brew list tesseract >/dev/null 2>&1 || \
            brew install tesseract

          brew list tesseract-lang >/dev/null 2>&1 || \
            brew install tesseract-lang

          echo ""
          echo "Tesseract version:"
          tesseract --version

      # ------------------------------------------------------------
      # 8. Download M2M100 model
      # ------------------------------------------------------------
      - name: Download M2M100 translation model
        run: |
          set -euxo pipefail

          MODEL="$PWD/resources/models/m2m100_418M"

          mkdir -p "$MODEL"

          .venv/bin/python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download

          root = Path.cwd()
          dest = root / "resources" / "models" / "m2m100_418M"

          dest.mkdir(parents=True, exist_ok=True)

          print("Downloading/checking M2M100 418M...")
          print("Destination:", dest)

          snapshot_download(
              repo_id="facebook/m2m100_418M",
              local_dir=str(dest),
              local_dir_use_symlinks=False,
          )

          required = [
              "config.json",
              "tokenizer_config.json",
              "sentencepiece.bpe.model",
          ]

          # The model may use either PyTorch or safetensors weights.
          weights = [
              dest / "pytorch_model.bin",
              dest / "model.safetensors",
          ]

          missing = [
              name for name in required
              if not (dest / name).is_file()
          ]

          if not any(p.is_file() for p in weights):
              missing.append("model weights")

          if missing:
              raise SystemExit(
                  "M2M100 download incomplete: "
                  + ", ".join(missing)
              )

          print("M2M100 model ready.")
          PY

      # ------------------------------------------------------------
      # 9. Bundle OCR
      # ------------------------------------------------------------
      - name: Bundle Tesseract
        run: |
          set -euxo pipefail

          chmod +x scripts/bundle_tesseract.command

          TPREFIX="$(brew --prefix tesseract)"
          LANGPREFIX="$(brew --prefix tesseract-lang)"

          echo "Tesseract prefix:"
          echo "$TPREFIX"

          echo "Language package prefix:"
          echo "$LANGPREFIX"

          DEST="$PWD/resources/tesseract"

          rm -rf "$DEST"

          mkdir -p \
            "$DEST/bin" \
            "$DEST/lib" \
            "$DEST/share/tessdata"

          # --------------------------------------------------------
          # Copy Tesseract executable
          # --------------------------------------------------------
          cp -L \
            "$TPREFIX/bin/tesseract" \
            "$DEST/bin/tesseract"

          chmod +x "$DEST/bin/tesseract"

          # --------------------------------------------------------
          # Find and copy ONLY the six languages we need
          # --------------------------------------------------------
          for lang in eng rus tha ind lav kat; do

            echo ""
            echo "Searching for $lang.traineddata..."

            FOUND=""

            while IFS= read -r file; do
              if [ -f "$file" ]; then
                FOUND="$file"
                break
              fi
            done < <(
              find \
                "$TPREFIX" \
                "$LANGPREFIX" \
                -type f \
                -name "${lang}.traineddata" \
                2>/dev/null
            )

            if [ -z "$FOUND" ]; then
              echo ""
              echo "ERROR:"
              echo "$lang.traineddata was not found."
              echo ""
              echo "Available traineddata files:"
              find \
                "$TPREFIX" \
                "$LANGPREFIX" \
                -type f \
                -name "*.traineddata" \
                2>/dev/null | head -100 || true

              exit 1
            fi

            echo "Found:"
            echo "$FOUND"

            cp -L \
              "$FOUND" \
              "$DEST/share/tessdata/${lang}.traineddata"

          done

          # --------------------------------------------------------
          # Bundle Tesseract dynamic dependencies
          # --------------------------------------------------------
          ./scripts/bundle_tesseract.command

      # ------------------------------------------------------------
      # 10. Verify OCR
      # ------------------------------------------------------------
      - name: Verify OCR bundle
        run: |
          set -euxo pipefail

          TESS="$PWD/resources/tesseract/bin/tesseract"
          DATA="$PWD/resources/tesseract/share/tessdata"

          test -x "$TESS"

          for lang in eng rus tha ind lav kat; do

            FILE="$DATA/${lang}.traineddata"

            if [ ! -s "$FILE" ]; then
              echo "Missing OCR language:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $lang"
            ls -lh "$FILE"

          done

          echo ""
          echo "Available bundled languages:"

          "$TESS" \
            --tessdata-dir "$DATA" \
            --list-langs

      # ------------------------------------------------------------
      # 11. Verify fonts
      # ------------------------------------------------------------
      - name: Verify fonts
        run: |
          set -euxo pipefail

          .venv/bin/python scripts/preflight.py

      # ------------------------------------------------------------
      # 12. Prepare build scripts
      # ------------------------------------------------------------
      - name: Prepare build scripts
        run: |
          set -euxo pipefail

          chmod +x build-mac.command

      # ------------------------------------------------------------
      # 13. Build .app + .dmg
      # ------------------------------------------------------------
      - name: Build macOS application
        run: |
          set -euxo pipefail

          ./build-mac.command

      # ------------------------------------------------------------
      # 14. Verify application
      # ------------------------------------------------------------
      - name: Verify application
        run: |
          set -euxo pipefail

          APP="release/PDF Translator.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Application was not created."

            echo ""
            echo "Release directory:"
            find release -maxdepth 3 -print || true

            exit 1
          fi

          echo "Application:"
          du -sh "$APP"

      # ------------------------------------------------------------
      # 15. Check executable
      # ------------------------------------------------------------
      - name: Check macOS executable
        run: |
          set -euxo pipefail

          APP="release/PDF Translator.app"

          EXECUTABLE="$APP/Contents/MacOS/PDF Translator"

          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: Application executable not found:"
            echo "$EXECUTABLE"

            echo ""
            echo "Available executables:"
            find "$APP/Contents/MacOS" \
              -type f \
              -maxdepth 2 \
              -print

            exit 1
          fi

          echo "Executable found:"
          file "$EXECUTABLE"

          echo ""
          echo "Dependencies:"
          otool -L "$EXECUTABLE" || true

      # ------------------------------------------------------------
      # 16. Check for old Tk/Carbon dependency
      # ------------------------------------------------------------
      - name: Check for Tk Carbon dependency
        run: |
          set -euxo pipefail

          EXECUTABLE="release/PDF Translator.app/Contents/MacOS/PDF Translator"

          echo "Checking for forbidden Tk/Tcl/Carbon dependencies..."

          if otool -L "$EXECUTABLE" | \
             grep -Ei \
             'Carbon\.framework|Tk\.framework|Tcl\.framework|libtk|libtcl|_tkinter'
          then

            echo ""
            echo "ERROR:"
            echo "The application still contains a Tk/Tcl/Carbon dependency."

            exit 1
          fi

          echo ""
          echo "PASS:"
          echo "No direct Tk/Tcl/Carbon dependency detected."

      # ------------------------------------------------------------
      # 17. Create DMG
      # ------------------------------------------------------------
      - name: Create DMG
        run: |
          set -euxo pipefail

          APP="release/PDF Translator.app"
          DMG="release/PDFTranslator-macOS.dmg"

          rm -f "$DMG"

          hdiutil create \
            -volname "PDF Translator" \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            "$DMG"

      # ------------------------------------------------------------
      # 18. Verify DMG
      # ------------------------------------------------------------
      - name: Verify DMG
        run: |
          set -euxo pipefail

          DMG="release/PDFTranslator-macOS.dmg"

          test -f "$DMG"

          echo "DMG created:"
          ls -lh "$DMG"

          echo ""
          echo "DMG information:"
          hdiutil imageinfo "$DMG"

      # ------------------------------------------------------------
      # 19. Upload finished application
      # ------------------------------------------------------------
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: PDFTranslator-macOS
          path: |
            release/PDFTranslator-macOS.dmg
            release/PDF Translator.app
          if-no-files-found: error
          retention-days: 30
